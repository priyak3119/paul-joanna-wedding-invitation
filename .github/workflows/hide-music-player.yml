name: Hide wedding music player

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-music-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide embedded music player
        shell: bash
        run: |
          if ! grep -q "PAUL-JOANNA-HIDDEN-MUSIC" style.css; then
            cat >> style.css <<'EOF'

/* PAUL-JOANNA-HIDDEN-MUSIC
   Keep the official YouTube embed as the audio source, but never show a
   video/player/card to wedding guests. Music is controlled by the round ♪
   button and starts only after the envelope is opened. */
.youtube-music,
.youtube-music.visible {
  position: fixed !important;
  left: -10000px !important;
  top: 0 !important;
  bottom: auto !important;
  width: 1px !important;
  height: 1px !important;
  min-width: 0 !important;
  overflow: hidden !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  opacity: 0 !important;
  pointer-events: none !important;
  transform: none !important;
}
.youtube-music p {
  display: none !important;
}
.youtube-music iframe {
  display: block !important;
  width: 1px !important;
  height: 1px !important;
  border: 0 !important;
  opacity: 0 !important;
  pointer-events: none !important;
}
EOF
          fi
      - name: Commit music UI fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "Hide music player and keep background audio"
          git push
